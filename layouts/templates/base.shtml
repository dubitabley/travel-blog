<!DOCTYPE html>
<html>
	<head id="head">
		<meta charset="utf-8">
		<meta name="viewport" content="initial-scale=1">
		<title :text="$site.title.suffix(' - ', $page.title)"></title>
		<link type="text/css" rel="stylesheet" href="$site.asset('style.css').link()">
		<link type="image/svg+xml" rel="icon" href="$site.asset('favicon.svg').link()">
		<link rel="alternate" type="application/rss+xml"
		    href="$site.page('blog').alternative('rss').link()" title="dubitable's travel RSS Feed">
		<super>
	</head>
	<body id="body">
		<h1 class="site-title" :text="$site.title"></h1>
		<nav>
			<a href="$site.page('').link()">Home</a>
			&nbsp; <strong>||</strong> &nbsp;
			<a href="$site.page('about').link()">About</a>
			&nbsp; <strong>||</strong> &nbsp;
			<a href="$site.page('blog').link()">Blog</a>
			&nbsp; <strong>||</strong> &nbsp;
			<a href="https://dubitable.xyz">Main site</a>
		</nav>
		<super>
		<footer>
		    <hr>
			<div class="footer-bottom">
    			<span>
    			    Made by <a href="https://dubitable.xyz">dubitable</a>
    			</span>
    			<div class="footer-buttons">
                    <a href="$site.page('blog').alternative('rss').link()">
                        <img width="30" height="30"
                            src="$site.asset('rss.svg').link()"
                            alt="RSS Feed Icon" title="RSS Feed">
                    </a>
                </div>
			</div>
		</footer>
	</body>
</html>
